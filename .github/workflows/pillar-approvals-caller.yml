name: pillar-approvals
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  pull-requests: read
  contents: read
concurrency:
  group: pillar-approvals-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pillar-approvals:
    uses: mcccd-IT-Operations/.github/.github/workflows/pillar-approvals.yml@main
    secrets:
      PILLAR_CHECK_TOKEN: ${{ secrets.PILLAR_CHECK_TOKEN }}
